    <tspan x="99" y="687">"dat_file" is a stand-in for any data file name that might be varied, e.g., "bstrk".</tspan>
    <tspan x="99" y="703">"inp_file" is a stand-in for any input scenario, e.g., "blxD".</tspan>
    <tspan x="99" y="719">"NN" is a stand-in for digits with the simulation number.</tspan>
    <tspan x="99" y="735">Arrows indicate the flow of processing forward, inputs to programs (in rectangles) or outputs from the programs.</tspan>
  </text>
